<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Generate VAPID Keys</title></head>
<body>
<h2>VAPID Key Generator</h2>
<pre id="out">Generating...</pre>
<script>
(async () => {
  const keyPair = await crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' },
    true,
    ['deriveKey']
  );

  function toBase64Url(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  const pubRaw = await crypto.subtle.exportKey('raw', keyPair.publicKey);
  const privJwk = await crypto.subtle.exportKey('jwk', keyPair.privateKey);

  const publicKey = toBase64Url(pubRaw);
  const privateKey = privJwk.d.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

  document.getElementById('out').textContent =
    'VAPID_PUBLIC_KEY=' + publicKey + '\n\nVAPID_PRIVATE_KEY=' + privateKey +
    '\n\n--- Copia estas dos claves y cierra esta página ---';
})();
</script>
</body>
</html>
